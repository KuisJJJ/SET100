name: Update Dashboard from Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'SET100_Investment_Research_Master.xlsx'
      - 'scripts/excel_to_json.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate data.json from Excel
        run: python scripts/excel_to_json.py

      - name: Commit updated data.json
        run: |
          if git diff --quiet -- data.json; then
            echo "No data.json changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update dashboard data from Excel"
          git push
