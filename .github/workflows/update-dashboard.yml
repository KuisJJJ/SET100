name: Update Dashboard from Excel

on:
  push:
    branches: [ main ]
    paths:
      - 'SET100_Investment_Research_Master.xlsx'
      - 'scripts/**'
      - 'business_profiles.json'
      - '.github/workflows/update-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: set100-dashboard-update
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve Team Comments
        run: python scripts/preserve_comments.py

      - name: Generate data.json from Excel
        run: python scripts/excel_to_json.py

      - name: Normalize all displayed research text to Thai
        run: python scripts/translate_research_th.py

      - name: Thai terminology cleanup
        run: python scripts/thai_research_cleanup.py

      - name: Finalize Thai explanatory prose
        run: python scripts/thai_language_finalizer.py

      - name: Finish remaining mixed English descriptors and QA
        run: python scripts/thai_language_finishing_terms.py

      - name: Refresh all stock market data and validate SET100
        env:
          SET_MARKETPLACE_API_KEY: ${{ secrets.SET_MARKETPLACE_API_KEY }}
        run: python scripts/update_data.py

      - name: Refresh dated financial facts and check new filings
        run: python scripts/update_financial_data.py
      - name: Refresh SET Index
        env:
          SET_MARKETPLACE_API_KEY: ${{ secrets.SET_MARKETPLACE_API_KEY }}
          SET_INDEX_VALUE_UNIT: ${{ vars.SET_INDEX_VALUE_UNIT }}
        run: python scripts/update_set_index.py

      - name: Apply Thai UI and dashboard theme
        run: python scripts/patch_dashboard_ui.py

      - name: Commit synchronized files
        run: |
          if git diff --quiet -- data.json update_status.json financial_snapshots.json financial_update_status.json team_comments.json research_th_cache.json research_translation_status.json research_thai_qa.json SET100_Investment_Research_Master.xlsx index.html; then
            echo "No synchronized changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json update_status.json financial_snapshots.json financial_update_status.json team_comments.json research_th_cache.json research_translation_status.json research_thai_qa.json SET100_Investment_Research_Master.xlsx index.html
          git commit -m "Sync Thai research, market data, SET Index and dashboard UI"
          git push
